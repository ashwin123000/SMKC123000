      levenshtein: function(a, b) {
        const an = a.length, bn = b.length;
        if (an === 0) return bn;
        if (bn === 0) return an;
        const matrix = [];
        for (let i = 0; i <= bn; i++) matrix[i] = [i];
        for (let j = 0; j <= an; j++) matrix[0][j] = j;
        for (let i = 1; i <= bn; i++) {
          for (let j = 1; j <= an; j++) {
            if (b.charAt(i - 1) === a.charAt(j - 1)) {
              matrix[i][j] = matrix[i - 1][j - 1];
            } else {
              matrix[i][j] = Math.min(
                matrix[i - 1][j - 1] + 1,
                matrix[i][j - 1] + 1,
                matrix[i - 1][j] + 1
              );
            }
          }
        }
        return matrix[bn][an];
      },

      fuzzyDetectCategory: function(text) {
        const words = text.toLowerCase().replace(/[^\w\s\u0900-\u097F]/g, ' ').split(/\s+/).filter(w => w.length > 1);
        const scores = {};
        let bestCategory = null;
        let bestScore = 0;

        for (const [cat, data] of Object.entries(this.CIVIC_KEYWORDS)) {
          scores[cat] = 0;
          const allKeywords = [...data.latin, ...data.english];

          for (const word of words) {
            for (const dWord of data.devanagari) {
              if (word === dWord.toLowerCase() || word.includes(dWord.toLowerCase()) || dWord.toLowerCase().includes(word)) {
                scores[cat] += 10;
              }
            }

            for (const kw of allKeywords) {
              if (word === kw) {
                scores[cat] += 10;
              }
            }

            for (const kw of allKeywords) {
              if (kw.length >= 5 && word.length >= 5) {
                const dist = this.levenshtein(word, kw);
                if (dist === 1) {
                  scores[cat] += 7;
                } else if (dist === 2) {
                  scores[cat] += 4;
                }
              }
            }

            for (const kw of allKeywords) {
              if (kw.length >= 4 && word.length >= 4 && word !== kw) {
                if (word.includes(kw) || kw.includes(word)) {
                  scores[cat] += 5;
                }
              }
            }
          }

          if (scores[cat] > bestScore) {
            bestScore = scores[cat];
            bestCategory = cat;
          }
        }

        return bestScore >= 4 ? { category: bestCategory, score: bestScore, label: this.CIVIC_KEYWORDS[bestCategory].label } : null;
      },

      init: function(micBtnId, textareaId, badgeId, translationId, langSelectId) {
        const micBtn = document.getElementById(micBtnId);
        const textarea = document.getElementById(textareaId);
        const badge = document.getElementById(badgeId);
        const translationText = document.getElementById(translationId);
        const langSelect = document.getElementById(langSelectId);

        if (!micBtn || !textarea) return;
        if (micBtn.dataset.voiceBound === 'true') return;
        micBtn.dataset.voiceBound = 'true';
        if (badge) {
          badge.textContent = 'Tap the microphone to speak';
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
          micBtn.disabled = true;
          micBtn.title = 'Voice input is not supported in this browser. Please type your complaint.';
          micBtn.style.opacity = '0.6';
          micBtn.style.cursor = 'not-allowed';
          if (badge) {
            badge.textContent = 'Voice input is not supported in this browser. Please type your complaint.';
          }
          return;
        }

        this.recognition = new SpeechRecognition();
        this.recognition.continuous = false;
        this.recognition.interimResults = true;
        this.recognition.maxAlternatives = 3;
        if (window.SpeechRecognitionPhrase && 'phrases' in this.recognition) {
          try {
            this.recognition.phrases = this.VOICE_PHRASES.map(phrase => new window.SpeechRecognitionPhrase(phrase, 6));
          } catch (e) {
            console.info('Contextual speech hints are unavailable in this browser.');
          }
        }

        const applySelectedLanguage = () => {
          const selected = langSelect ? langSelect.value : 'Marathi';
          const langMap = { Marathi: 'mr-IN', Hindi: 'hi-IN', English: 'en-IN' };
          this.recognition.lang = langMap[selected] || 'mr-IN';
        };
        applySelectedLanguage();

        if (langSelect) {
          langSelect.addEventListener('change', applySelectedLanguage);
        }

        const self = this;

        micBtn.addEventListener('click', (event) => {
          if (event && typeof event.preventDefault === 'function') {
            event.preventDefault();
          }

          if (self.isListening) {
            self.stopListening(micBtn, badge);
          } else {
            self.startListening(micBtn, textarea, badge, translationText);
          }
        });
      },

      startListening: function(micBtn, textarea, badge, translationText) {
        if (!this.recognition) return;

        try {
          const langSelect = document.getElementById('voice-language');
          const selected = langSelect ? langSelect.value : 'Marathi';
          const langMap = { Marathi: 'mr-IN', Hindi: 'hi-IN', English: 'en-IN' };
          this.recognition.lang = langMap[selected] || 'mr-IN';
          this.sessionBaseText = textarea && textarea.value ? textarea.value.trim() : '';
          this.recognition.start();
          this.isListening = true;

          if (badge) {
            badge.textContent = `Listening in ${selected}... speak clearly; your words will appear here`;
          }
          if (micBtn) {
            micBtn.style.background = '#dc2626';
            micBtn.style.color = '#fff';
            micBtn.innerHTML = '<span>🔴</span> Listening... Speak now';
          }
        } catch (e) {
          console.warn('Speech recognition error:', e);
          if (badge) {
            badge.textContent = 'Voice input unavailable. You can type your complaint instead.';
          }
        }

        const self = this;

        this.recognition.onresult = function(event) {
          let finalTranscript = '';
          let interimTranscript = '';
          for (let i = 0; i < event.results.length; i++) {
            const alternatives = event.results[i];
            let bestAlternative = alternatives[0];
            let bestScore = -1;
            for (let alternativeIndex = 0; alternativeIndex < alternatives.length; alternativeIndex++) {
              const alternative = alternatives[alternativeIndex];
              const candidate = alternative.transcript.trim();
              const lowerCandidate = candidate.toLocaleLowerCase();
              const civicMatches = self.VOICE_PHRASES.reduce((count, phrase) => count + (lowerCandidate.includes(phrase.toLocaleLowerCase()) ? 1 : 0), 0);
              const score = civicMatches * 2 + (Number(alternative.confidence) || 0);
              if (score > bestScore) {
                bestAlternative = alternative;
                bestScore = score;
              }
            }
            const resultText = bestAlternative ? bestAlternative.transcript.trim() : '';
            if (!resultText) continue;
            if (event.results[i].isFinal) {
              finalTranscript += `${finalTranscript ? ' ' : ''}${resultText}`;
            } else {
              interimTranscript += `${interimTranscript ? ' ' : ''}${resultText}`;
            }
          }

          const liveTranscript = [finalTranscript, interimTranscript].filter(Boolean).join(' ').trim();
          if (textarea && liveTranscript) {
            const updatedText = [self.sessionBaseText, liveTranscript].filter(Boolean).join(self.sessionBaseText ? '\n' : '');
            const nativeValueSetter = Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, 'value')?.set;
            if (nativeValueSetter) nativeValueSetter.call(textarea, updatedText);
            else textarea.value = updatedText;
            textarea.dispatchEvent(new Event('input', { bubbles: true }));
          }

          const latestResult = event.results[event.results.length - 1];
          if (latestResult && latestResult.isFinal && finalTranscript) {
            self.stopListening(micBtn, badge);
            self.processTranslationAndAutoForm(finalTranscript, badge, translationText);
          }
        };

        this.recognition.onerror = function(event) {
          console.warn('Speech recognition error event:', event.error);
          self.stopListening(micBtn, badge);
          if (badge) {
            const messages = {
              'no-speech': 'No speech detected. Tap the microphone and speak clearly.',
              'audio-capture': 'Microphone not available. Check your microphone connection.',
              'not-allowed': 'Microphone permission is blocked. Allow microphone access in your browser.',
              network: 'Speech service unavailable. Check your internet connection and try again.'
            };
            badge.textContent = messages[event.error] || 'Voice input unavailable. You can type your complaint instead.';
          }
        };

        this.recognition.onend = function() {
          if (self.isListening) {
            self.stopListening(micBtn, badge);
          }
        };
      },

      stopListening: function(micBtn, badge) {
        this.isListening = false;
        if (this.recognition) {
          try { this.recognition.stop(); } catch (e) {}
        }
        if (badge) {
          badge.textContent = 'Voice input added';
        }
        if (micBtn) {
          micBtn.style.background = '#2563eb';
          micBtn.style.color = '#fff';
          micBtn.innerHTML = '<span>🎤</span> Speak in Marathi / Hindi / English';
        }
      },

      processTranslationAndAutoForm: async function(text, badge, translationText) {
        if (!text || text.trim() === '') return;

        if (badge) {
          badge.textContent = 'Processing your voice input...';
        }

        const englishTranslation = await this.translateToEnglish(text);
        const fuzzyResult = this.fuzzyDetectCategory(englishTranslation + ' ' + text);
        const aiSolution = this.generateAISolution(englishTranslation, text, fuzzyResult);

        if (badge) {
          badge.textContent = 'Voice input added';
        }
        if (translationText) {
          translationText.textContent = englishTranslation ? `Translation: ${englishTranslation}` : '';
        }

        window.currentAISolution = aiSolution;
        this.autoSelectFormOptions(englishTranslation, text, fuzzyResult);
      },

      generateAISolution: function(englishText, originalText, fuzzyResult) {
        const category = fuzzyResult ? fuzzyResult.category : null;
        const lower = (englishText + ' ' + originalText).toLowerCase();

        if (category === 'road' || lower.includes('road') || lower.includes('pothole') || lower.includes('tar') || lower.includes('traffic') || /खड्डा|गड्ढा|रस्ता/.test(originalText)) {
          return {
            plan: 'Reroute traffic around pothole. Dispatch Road Maintenance Crew with local patching machinery.',
            dept: 'Municipal Roads Cell',
            eta: '24 Hours'
          };
        } else if (category === 'water' || lower.includes('water') || lower.includes('leak') || lower.includes('pipe') || lower.includes('drain') || /पाणी|पानी/.test(originalText)) {
          return {
            plan: 'Isolate water line and dispatch maintenance team for urgent repair and leak check.',
            dept: 'Water & Sewer Division',
            eta: '12 Hours'
          };
        } else if (category === 'light' || lower.includes('light') || lower.includes('bulb') || lower.includes('electric') || lower.includes('dark') || /लाइट|दिवा|अंधार/.test(originalText)) {
          return {
            plan: 'Inspect wiring and replace faulty lighting component to restore safe street illumination.',
            dept: 'Street Lighting Cell',
            eta: '18 Hours'
          };
        } else if (category === 'garbage' || lower.includes('garbage') || lower.includes('waste') || lower.includes('clean') || lower.includes('trash') || /कचरा|घाण/.test(originalText)) {
          return {
            plan: 'Arrange urgent waste clearance and sanitation team to remove illegal dump and restore cleanliness.',
            dept: 'Sanitation Division',
            eta: '6 Hours'
          };
        } else if (category === 'park') {
          return {
            plan: 'Inspect tree and public area safety risk and deploy landscape maintenance team.',
            dept: 'Garden & Environment Cell',
            eta: '48 Hours'
          };
        }

        return {
          plan: 'Issue to the relevant municipal department for site inspection and compliance review.',
          dept: 'Municipal Control Cell',
          eta: '24 Hours'
        };
      },

      translateToEnglish: async function(text) {
        const isDevanagari = /[\u0900-\u097F]/.test(text);
        if (!isDevanagari) return text;

        try {
          const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=mr|en`;
          const res = await fetch(url);
          if (res.ok) {
            const data = await res.json();
            if (data && data.responseData && data.responseData.translatedText) {
              const translated = data.responseData.translatedText;
              if (translated.toLowerCase() !== text.toLowerCase() && translated.trim().length > 0) {
                return translated;
              }
            }
          }
        } catch (e) {
          console.warn('Marathi translation fallback, trying Hindi...', e);
        }

        try {
          const url2 = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=hi|en`;
          const res2 = await fetch(url2);
          if (res2.ok) {
            const data2 = await res2.json();
            if (data2 && data2.responseData && data2.responseData.translatedText) {
              const translated2 = data2.responseData.translatedText;
              if (translated2.toLowerCase() !== text.toLowerCase() && translated2.trim().length > 0) {
                return translated2;
              }
            }
          }
        } catch (e2) {
          console.warn('Hindi translation failed, using fuzzy fallback:', e2);
        }

        return this.dictionaryFallbackTranslate(text);
      },

      dictionaryFallbackTranslate: function(text) {
        let t = text;
        const dict = [
          { deba: /रस्ता|रस्ते|खड्डा|खड्डे|सड़क|गड्ढा|गड्ढे|सिमेंट|डांबर|ट्रॅफिक|वाहतूक|पूल|ट्रैफिक|जाम|फुटपाथ|उखडा|तुटलेला/gi, en: 'road pothole infrastructure issue' },
          { deba: /पाणी|पानी|गळती|लीकेज|पाईप|नळ|गटार|नाली|ड्रेनेज|सांडपाणी|टाकी|ओवरफ्लो|बोअरवेल|विहीर|जलवाहिनी|मलवाहिनी/gi, en: 'water pipeline leakage issue' },
          { deba: /लाइट|दिवा|दिवे|बत्ती|बिजली|विद्युत|अंधार|अंधेरा|वायर|खांब|खाम|ट्रान्सफॉर्मर|फ्यूज|शॉर्टसर्किट|बल्ब/gi, en: 'dark streetlight electricity issue' },
          { deba: /कचरा|घाण|सफाई|कचरागाडी|दुर्गंधी|प्लास्टिक|कचरापेटी|स्वच्छता|बदबू|उकिरडा|डंपिंग|मैला|गंदगी/gi, en: 'garbage waste sanitation issue' },
          { deba: /झाड|झाडे|पेड़|फांदी|बाग|उद्यान|हवा|प्रदूषण|झाडी|पार्क|बगीचा|वृक्ष|गार्डन/gi, en: 'tree park environment issue' }
        ];

        dict.forEach(item => {
          if (item.deba.test(t)) {
            t = t.replace(item.deba, item.en);
          }
        });

        return t;
      },

      autoSelectFormOptions: function(englishText, originalText, fuzzyResult) {
        const category = fuzzyResult ? fuzzyResult.category : null;

        const categorySelect = document.getElementById('category-select') || document.getElementById('issue-category') || document.getElementById('exp-category');

        if (categorySelect) {
          if (category === 'road' || lower.includes('road') || lower.includes('pothole') || lower.includes('tar') || lower.includes('traffic')) {
            categorySelect.value = categorySelect.options[0] ? categorySelect.options[0].value : 'Infrastructure & Roads';
          } else if (category === 'water' || lower.includes('water') || lower.includes('leak') || lower.includes('pipe') || lower.includes('drain')) {
            categorySelect.value = categorySelect.options[2] ? categorySelect.options[2].value : 'Water & Electricity';

            categorySelect.value = categorySelect.options[2] ? categorySelect.options[2].value : 'Water & Electricity';

            prioritySelect.value = 'HIGH';

                        </div>
                        <a href="https://www.openstreetmap.org/#map=13/16.8524/74.605" target="_blank" rel="noreferrer" className="inline-flex items-center gap-2 rounded border border-slate-300 px-3 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50">
                          Open full map ↗
                        </a>
                      </div>
                      <div className="h-[min(68vh,680px)] min-h-[420px] w-full">
                        <div ref={adminMapContainerRef} className="h-full w-full" />
                      </div>
                      <div className="flex flex-wrap gap-4 border-t border-slate-200 px-5 py-3 text-xs text-slate-600">
                        <span><i className="mr-1 inline-block h-2.5 w-2.5 rounded-full bg-red-700" /> Action required</span>
                        <span><i className="mr-1 inline-block h-2.5 w-2.5 rounded-full bg-amber-600" /> Expired permit</span>
                        <span><i className="mr-1 inline-block h-2.5 w-2.5 rounded-full bg-emerald-700" /> Cleared / permitted</span>
                      </div>
                    </section>
                  ) : activeAdminView === 'Reports' ? (
                    <section className="overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm">
                      <div className="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 px-5 py-4">
                        <div>
                          <h2 className="text-lg font-bold text-slate-900">Municipal Enforcement Reports</h2>
                          <p className="text-xs text-slate-500">Reports from local citizen submissions and hoarding registry</p>
                        </div>
                        <div className="flex gap-2">
                          <button onClick={() => window.print()} className="rounded border border-slate-300 px-3 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50">Print report</button>
                          <button onClick={() => {
                            const rows = [['Record ID', 'Category', 'Location', 'City', 'Status', 'Progress / Fine']];
                            scannedSubmissions.forEach(item => rows.push([item.id, 'Citizen report', item.location, item.city, item.status, `${item.workProgress}%`]));
                            initialHoardingsData.forEach(item => rows.push([item.id, item.classification, item.locationName, item.city, item.status, `INR ${item.fineAmount}`]));
                            const csv = rows.map(row => row.map(value => `"${String(value ?? '').replaceAll('"', '""')}"`).join(',')).join('\r\n');
                            const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
                            const link = document.createElement('a');
                            link.href = url;
                            link.download = 'smkc-enforcement-report.csv';
                            link.click();
                            URL.revokeObjectURL(url);
                          }} className="rounded bg-[#17466c] px-3 py-2 text-xs font-semibold text-white hover:bg-[#103551]">Export CSV</button>
                        </div>
                      </div>
                      <div className="grid grid-cols-2 gap-px border-b border-slate-200 bg-slate-200 md:grid-cols-4">
                        {[
                          ['Citizen reports', scannedSubmissions.length],
                          ['Registry records', initialHoardingsData.length],
                          ['Action required', initialHoardingsData.filter(item => item.status !== 'permitted').length + scannedSubmissions.filter(item => item.workProgress < 100).length],
                          ['Estimated fines', `₹${initialHoardingsData.reduce((sum, item) => sum + (item.fineAmount || 0), 0).toLocaleString('en-IN')}`]
                        ].map(([label, value]) => <div key={label} className="bg-white px-5 py-4"><div className="text-xl font-bold text-slate-900">{value}</div><div className="mt-1 text-xs text-slate-500">{label}</div></div>)}
                      </div>
                      <div className="p-4">
                        <input value={adminReportSearch} onChange={event => setAdminReportSearch(event.target.value)} placeholder="Filter by record, location, city or status" className="mb-4 w-full rounded border border-slate-300 px-3 py-2 text-sm outline-none focus:border-blue-600 md:max-w-md" />
                        <div className="overflow-x-auto">
                          <table className="w-full min-w-[760px] border-collapse text-left text-sm">
                            <thead><tr className="border-y border-slate-200 bg-slate-50 text-xs uppercase text-slate-500"><th className="px-3 py-3">Record</th><th className="px-3 py-3">Type</th><th className="px-3 py-3">Location</th><th className="px-3 py-3">City</th><th className="px-3 py-3">Status</th><th className="px-3 py-3">Amount / progress</th></tr></thead>
                            <tbody>
                              {[
                                ...scannedSubmissions.map(item => ({ id: item.id, type: 'Citizen report', location: item.location, city: item.city, status: item.status, amount: `${item.workProgress}%` })),
                                ...initialHoardingsData.map(item => ({ id: item.id, type: item.classification, location: item.locationName, city: item.city, status: item.status, amount: `₹${(item.fineAmount || 0).toLocaleString('en-IN')}` }))
                              ].filter(item => `${item.id} ${item.type} ${item.location} ${item.city} ${item.status}`.toLowerCase().includes(adminReportSearch.toLowerCase())).map(item => (
                                <tr key={item.id} className="border-b border-slate-100 hover:bg-slate-50"><td className="px-3 py-3 font-semibold text-slate-800">{item.id}</td><td className="px-3 py-3 text-slate-600">{item.type}</td><td className="px-3 py-3 text-slate-600">{item.location}</td><td className="px-3 py-3 text-slate-600">{item.city}</td><td className="px-3 py-3"><span className="rounded-full bg-slate-100 px-2 py-1 text-xs font-semibold text-slate-700">{item.status}</span></td><td className="px-3 py-3 font-medium text-slate-800">{item.amount}</td></tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </section>
                  ) : activeAdminView === 'Enforcement' ? (
                    <section className="overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm">
                      <div className="border-b border-slate-200 px-5 py-4">
                        <h2 className="text-lg font-bold text-slate-900">Enforcement Queue</h2>
                        <p className="text-xs text-slate-500">Open actions from current citizen submissions</p>
                      </div>
                      <div className="overflow-x-auto p-4">
                        <table className="w-full min-w-[700px] text-left text-sm">
                          <thead><tr className="border-b border-slate-200 text-xs uppercase text-slate-500"><th className="px-3 py-3">Case</th><th className="px-3 py-3">Location</th><th className="px-3 py-3">Assigned unit</th><th className="px-3 py-3">Status</th><th className="px-3 py-3">Progress</th><th className="px-3 py-3"></th></tr></thead>
                          <tbody>{scannedSubmissions.filter(item => item.workProgress < 100).map(item => (
                            <tr key={item.id} className="border-b border-slate-100">
                              <td className="px-3 py-3 font-semibold text-slate-800">{item.id}</td><td className="px-3 py-3 text-slate-600">{item.location}, {item.city}</td><td className="px-3 py-3 text-slate-600">{item.assignedSquad || 'Ward response unit'}</td><td className="px-3 py-3">{item.status}</td><td className="px-3 py-3"><div className="flex items-center gap-2"><div className="h-1.5 w-20 rounded-full bg-slate-100"><div className="h-1.5 rounded-full bg-blue-700" style={{ width: `${item.workProgress}%` }} /></div>{item.workProgress}%</div></td><td className="px-3 py-3"><button onClick={() => { setSelectedOfficerScanId(item.id); setOfficerStage(item.status); setOfficerProgressPercent(item.workProgress); setOfficerRemarks(item.progressRemarks || ''); setActiveAdminView('Dashboard'); }} className="font-semibold text-blue-700 hover:underline">Open case</button></td>
                            </tr>
                          ))}</tbody>
                        </table>
                      </div>
                    </section>
                  ) : activeAdminView === 'Truck Detections' ? (
                    <section className="overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm">
                      <div className="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 px-5 py-4">
                        <div><h2 className="text-lg font-bold text-slate-900">Field Detection Units</h2><p className="text-xs text-slate-500">Local demonstration route data · OSM coordinates are approximate</p></div>
                        <button onClick={() => setActiveAdminView('Map View')} className="rounded border border-slate-300 px-3 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50">View on map</button>
                      </div>
                      <div className="overflow-x-auto p-4">
                        <table className="w-full min-w-[700px] text-left text-sm">
                          <thead><tr className="border-b border-slate-200 text-xs uppercase text-slate-500"><th className="px-3 py-3">Unit</th><th className="px-3 py-3">Assigned route</th><th className="px-3 py-3">Records scanned</th><th className="px-3 py-3">Last recorded point</th><th className="px-3 py-3">Route</th></tr></thead>
                          <tbody>{[
                            { id: 'SMKC-FIELD-01', route: 'Sangli Central · Vishrambag', count: scannedSubmissions.filter(item => item.city === 'Sangli').length + initialHoardingsData.filter(item => item.city === 'Sangli').length, coords: '16.8524, 74.5815' },
                            { id: 'SMKC-FIELD-02', route: 'Miraj Station · Gandhi Chowk', count: scannedSubmissions.filter(item => item.city === 'Miraj').length + initialHoardingsData.filter(item => item.city === 'Miraj').length, coords: '16.8272, 74.6469' },
                            { id: 'SMKC-FIELD-03', route: 'Kupwad MIDC · Railway Crossing', count: scannedSubmissions.filter(item => item.city === 'Kupwad').length + initialHoardingsData.filter(item => item.city === 'Kupwad').length, coords: '16.8778, 74.6111' }
                          ].map(unit => <tr key={unit.id} className="border-b border-slate-100"><td className="px-3 py-4 font-semibold text-slate-800">{unit.id}</td><td className="px-3 py-4 text-slate-600">{unit.route}</td><td className="px-3 py-4 text-slate-600">{unit.count}</td><td className="px-3 py-4 font-mono text-xs text-slate-600">{unit.coords}</td><td className="px-3 py-4"><a className="font-semibold text-blue-700 hover:underline" target="_blank" rel="noreferrer" href={`https://www.openstreetmap.org/?mlat=${unit.coords.split(', ')[0]}&mlon=${unit.coords.split(', ')[1]}#map=15/${unit.coords.replace(', ', '/')}`}>Open OSM</a></td></tr>)}</tbody>
                        </table>
                      </div>
                    </section>
                  ) : activeAdminView === 'Settings' ? (
                    <section className="max-w-3xl rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
                      <h2 className="text-lg font-bold text-slate-900">Portal Settings</h2>
                      <p className="mt-1 text-sm text-slate-500">Current municipal workspace data</p>
                      <dl className="mt-6 divide-y divide-slate-100 text-sm">
                        <div className="flex justify-between gap-4 py-3"><dt className="text-slate-500">Map provider</dt><dd className="font-semibold text-slate-800">OpenStreetMap</dd></div>
                        <div className="flex justify-between gap-4 py-3"><dt className="text-slate-500">Local hoarding records</dt><dd className="font-semibold text-slate-800">{initialHoardingsData.length}</dd></div>
                        <div className="flex justify-between gap-4 py-3"><dt className="text-slate-500">Citizen submissions</dt><dd className="font-semibold text-slate-800">{scannedSubmissions.length}</dd></div>
                        <div className="flex justify-between gap-4 py-3"><dt className="text-slate-500">Signed-in account</dt><dd className="font-semibold text-slate-800">{officerProfile?.name || 'Municipal Officer'}</dd></div>
                      </dl>
                    </section>
                  ) : (
                    <>
                      {/* Top Stats Cards */}
                      <div className="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">
                        {[
                          { label: 'Total Cases', value: scannedSubmissions.length, icon: '📄', bg: 'bg-blue-50 text-blue-600' },
                          { label: 'Pending Verification', value: scannedSubmissions.filter(s => s.workProgress < 50).length, icon: '⏳', bg: 'bg-amber-50 text-amber-600' },
                          { label: 'Notices Issued', value: scannedSubmissions.filter(s => s.workProgress >= 50 && s.workProgress < 100).length, icon: '📋', bg: 'bg-purple-50 text-purple-600' },
                          { label: 'Under Action', value: scannedSubmissions.filter(s => s.workProgress >= 80 && s.workProgress < 100).length, icon: '🚨', bg: 'bg-emerald-50 text-emerald-600' },
                          { label: 'Closed', value: scannedSubmissions.filter(s => s.workProgress === 100).length, icon: '✅', bg: 'bg-slate-100 text-slate-600' }
                        ].map((stat, i) => (
                          <div key={i} className="bg-white rounded-xl p-4 border border-slate-200 shadow-sm flex items-center gap-4">
                            <div className={`w-12 h-12 rounded-lg flex items-center justify-center text-xl ${stat.bg}`}>
                              {stat.icon}
                            </div>
                            <div>
                              <div className="text-2xl font-black text-slate-800 leading-none mb-1">{stat.value}</div>
                              <div className="text-xs font-semibold text-slate-500 uppercase tracking-wide">{stat.label}</div>
                            </div>
                          </div>
                        ))}
                      </div>

                      {/* 3-Column Grid */}
                      <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 min-h-[600px]">
                        
                        {/* Column 1: Reported Cases List (3/12) */}
                        <div className="lg:col-span-3 bg-white rounded-xl border border-slate-200 shadow-sm flex flex-col overflow-hidden max-h-[70vh]">
                          <div className="p-4 border-b border-slate-200 flex items-center justify-between bg-slate-50/50">
                            <h3 className="font-bold text-slate-800 text-sm">Reported Cases</h3>
                          </div>
                          <div className="flex-1 overflow-y-auto p-2 space-y-2">
                            {scannedSubmissions.map(scan => {
                              const isSelected = scan.id === selectedOfficerScanId;
                              const displayStatus = scan.workProgress === 100 ? 'Closed' : scan.workProgress > 50 ? 'Notice Issued' : scan.workProgress > 20 ? 'Under Verification' : 'High Priority';
                              const realColor = scan.workProgress === 100 ? 'bg-emerald-100 text-emerald-800' : scan.workProgress > 50 ? 'bg-amber-100 text-amber-800' : 'bg-red-100 text-red-800';

                              return (
                                <div 
                                  key={scan.id}
                                  onClick={() => {
                                    setSelectedOfficerScanId(scan.id);
                                    setOfficerStage(scan.status || 'In Progress');
                                    setOfficerProgressPercent(scan.workProgress || 15);
                                    setOfficerRemarks(scan.progressRemarks || '');
                                  }}
                                  className={`p-3 rounded-lg border cursor-pointer transition-all flex gap-3 ${
                                    isSelected ? 'bg-blue-50 border-blue-300 shadow-sm ring-1 ring-blue-100' : 'bg-white border-slate-200 hover:border-blue-200'
                                  }`}
                                >
                                  <div className="w-16 h-16 rounded-lg bg-slate-100 shrink-0 overflow-hidden border border-slate-200">
                                    <img src={scan.imageUrl} alt="" className="w-full h-full object-cover" />
                                  </div>
                                  <div className="flex-1 min-w-0 flex flex-col justify-center">
                                    <div className="text-sm font-bold text-slate-800 truncate mb-1">{scan.id}</div>
                                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full inline-block w-fit mb-1.5 ${realColor}`}>
                                      {displayStatus}
                                    </span>
                                    <div className="text-[10px] text-slate-500 truncate">📍 {scan.location}</div>
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        </div>

                        {/* Column 2: Case Details (5/12) */}
                        <div className="lg:col-span-5 bg-white rounded-xl border border-slate-200 shadow-sm flex flex-col overflow-hidden relative max-h-[70vh]">
                          {(() => {
                            const currentScan = scannedSubmissions.find(s => s.id === selectedOfficerScanId) || scannedSubmissions[0];
                            if (!currentScan) return <div className="p-8 text-center text-slate-500">No cases available</div>;
                            return (
                              <>
                                <div className="p-4 border-b border-slate-200 flex items-center justify-between bg-slate-50/50">
                                  <h3 className="font-bold text-slate-800 text-sm">Case Details</h3>
                                  <span className="bg-red-100 text-red-800 text-[10px] font-bold px-2 py-1 rounded-md uppercase tracking-wide border border-red-200">High Priority</span>
                                </div>
                                
                                <div className="p-5 flex-1 overflow-y-auto">
                                  <h2 className="text-xl font-bold text-slate-900 mb-4">{currentScan.id}</h2>
                                  
                                  {/* Main Image */}
                                  <div className="w-full h-48 sm:h-64 bg-slate-100 rounded-xl mb-4 overflow-hidden border border-slate-200">
                                     <img src={currentScan.imageUrl} alt="Hoarding" className="w-full h-full object-cover" />
                                  </div>

                                  {/* Details Table */}
                                  <div className="space-y-3 text-sm">
                                    <div className="grid grid-cols-3 gap-2">
                                      <span className="text-slate-500 font-semibold">Citizen:</span>
                                      <span className="col-span-2 text-slate-800 font-medium">{currentScan.citizenName} ({currentScan.citizenPhone})</span>
                                    </div>
                                    <div className="grid grid-cols-3 gap-2">
                                      <span className="text-slate-500 font-semibold">Location:</span>
                                      <span className="col-span-2 text-slate-800 font-medium">{currentScan.location}, {currentScan.city}</span>
                                    </div>
                                    <div className="grid grid-cols-3 gap-2 items-center">
                                      <span className="text-slate-500 font-semibold">AI Suspicion Score:</span>
                                      <div className="col-span-2 flex items-center gap-3">
                                        <span className="text-slate-800 font-bold">92%</span>
                                        <div className="flex-1 h-2 bg-slate-100 rounded-full overflow-hidden border border-slate-200">
                                          <div className="h-full bg-red-500" style={{width: '92%'}}></div>
                                        </div>
                                      </div>
                                    </div>
                                    <div className="grid grid-cols-3 gap-2">
                                      <span className="text-slate-500 font-semibold">Note:</span>
                                      <span className="col-span-2 text-slate-600 bg-slate-50 p-2 rounded-lg border border-slate-100 text-xs">
                                        {currentScan.notes || "Large political flex hanging on street light pole, blocking traffic view."}
                                      </span>
                                    </div>
                                  </div>
                                </div>

                                {/* Actions Bar */}
                                <div className="p-4 border-t border-slate-200 bg-white flex flex-wrap gap-3">
                                  <button className="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded-lg font-bold text-sm shadow-sm">
                                    ✅ Verify
                                  </button>
                                  <button 
                                    onClick={() => {
                                      const h = { id: currentScan.id, locationName: currentScan.location, ward: currentScan.ward, city: currentScan.city, advertiser: currentScan.citizenName, contactNumber: currentScan.citizenPhone, fineAmount: currentScan.calculatedFine || 15000, imageUrl: currentScan.imageUrl };
                                      setSelectedNoticeItem(h);
                                      setActiveTab('notice');
                                      setIsAdminModalOpen(false);
                                    }}
                                    className="flex-1 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-bold text-sm shadow-sm"
                                  >
                                    📄 Generate Notice
                                  </button>
                                </div>
                              </>
                            );
                          })()}
                        </div>

                        {/* Column 3: Context & Tracking (4/12) */}
                        <div className="lg:col-span-4 flex flex-col gap-6 max-h-[70vh]">
                          
                          {/* GIS Map Card */}
                          <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden flex flex-col shrink-0">
                            <div className="p-3 border-b border-slate-200 flex items-center justify-between bg-slate-50/50">
                              <h3 className="font-bold text-slate-800 text-sm">Location & GIS</h3>
                            </div>
                            <div className="p-3">
                              <div className="h-32 w-full overflow-hidden rounded-lg border border-slate-200">
                                <div ref={adminMiniMapContainerRef} className="h-full w-full" />
                              </div>
                              <div className="mt-2 flex items-center justify-between text-[10px] text-slate-500">
                                <span>OpenStreetMap · Sangli, Miraj & Kupwad</span>
                                <button onClick={() => setActiveAdminView('Map View')} className="font-semibold text-blue-700 hover:underline">Full map</button>
                              </div>
                            </div>
                          </div>

                          {/* Enforcement Tracking & Update Form */}
                          <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden flex-1 flex flex-col min-h-0">
                            <div className="p-3 border-b border-slate-200 flex items-center justify-between bg-slate-50/50">
                              <h3 className="font-bold text-slate-800 text-sm">Enforcement Update</h3>
                              <span className="bg-amber-100 text-amber-800 text-[10px] font-bold px-2 py-1 rounded-md">Status: {officerStage || 'Pending'}</span>
                            </div>
                            <form onSubmit={handleOfficerProgressUpdate} className="p-4 flex-1 overflow-y-auto space-y-4">
                              {officerUpdateSuccess && <div className="text-xs text-emerald-600 font-bold bg-emerald-50 p-2 rounded border border-emerald-200">{officerUpdateSuccess}</div>}
                              {officerUpdateError && <div className="text-xs text-red-600 font-bold bg-red-50 p-2 rounded border border-red-200">{officerUpdateError}</div>}
                              
                              <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">Progress: {officerProgressPercent}%</label>
                                <input type="range" min="0" max="100" step="5" value={officerProgressPercent} onChange={e => setOfficerProgressPercent(Number(e.target.value))} className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600" />
                              </div>
                              
                              <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">Stage</label>
                                <select value={officerStage} onChange={e => setOfficerStage(e.target.value)} className="w-full text-xs px-2 py-2 border border-slate-300 rounded-lg outline-none">
                                  <option value="Received">Received (15%)</option>
                                  <option value="Squad Dispatched">Squad Dispatched (30%)</option>
                                  <option value="Field Inspection Complete">Field Inspection Complete (50%)</option>
                                  <option value="Notice Issued">Notice Issued (65%)</option>
                                  <option value="Demolition in Progress">Demolition in Progress (80%)</option>
                                  <option value="Resolved & Cleared">Resolved & Cleared (100%)</option>
                                </select>
                              </div>

                              <div>
                                <label className="block text-xs font-bold text-slate-700 mb-1">Remarks</label>
                                <textarea rows="2" value={officerRemarks} onChange={e => setOfficerRemarks(e.target.value)} className="w-full text-xs px-2 py-2 border border-slate-300 rounded-lg outline-none" placeholder="Add remarks here..." />
                              </div>

                              <button type="submit" disabled={isOfficerSaving} className="w-full bg-emerald-500 hover:bg-emerald-600 disabled:opacity-60 text-white font-bold text-xs py-2.5 rounded-lg shadow-sm">
                                {isOfficerSaving ? 'Saving...' : 'Update Progress ✓'}
                              </button>
                            </form>
                          </div>

                        </div>

                      </div>
                    </>
                  )}
                </main>
              </div>
            </div>
          )}

          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<SMKCApp />);
  </script>
</body>
</html>
